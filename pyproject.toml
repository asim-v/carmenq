[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zero-record-quantum-histories"
version = "1.1.0"
description = "Exact audit-return frontiers and reproducible benchmarks for causal quantum memory"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Causal Audit--Return Memory project contributors"}]
keywords = [
  "quantum information",
  "reversible computation",
  "causal inference",
  "interferometry",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
reproducibility = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "pytest==9.1.1",
]

[project.urls]
Repository = "https://github.com/asim-v/zero-record-quantum-histories"

[project.scripts]
rebuild-simulations = "reversible_histories.cli:main"
audit-return-benchmark = "reversible_histories.audit_return_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
