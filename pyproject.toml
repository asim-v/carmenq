[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carmenq"
version = "2.0.0"
description = "Causal audit-return memory evaluation and numerics for quantum processes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "LICENSE-CONTENT.md"]
authors = [{name = "Javier Emilio Bazán Sánchez", email = "bazan@ciencias.unam.mx"}]
keywords = [
  "quantum information",
  "quantum memory",
  "causal benchmarks",
  "entanglement fidelity",
  "reproducible research",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
reproducibility = [
  "numpy==2.2.6",
  "scipy==1.15.3",
  "matplotlib==3.10.9",
  "pytest==9.1.1",
]

[project.urls]
Homepage = "https://github.com/asim-v/carmenq"
Repository = "https://github.com/asim-v/carmenq"
Documentation = "https://github.com/asim-v/carmenq/tree/main/docs"
Issues = "https://github.com/asim-v/carmenq/issues"

[project.scripts]
carmenq = "carmenq.audit_return_cli:main"
carmenq-reproduce = "carmenq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
